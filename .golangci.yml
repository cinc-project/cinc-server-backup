version: "2"

# The default set: errcheck, govet, ineffassign, staticcheck, unused. govet
# makes a separate `go vet` step redundant, and the gofmt formatter below
# makes a separate `gofmt -l` step redundant, so CI runs this alone.
linters:
  default: standard

  settings:
    errcheck:
      # Errors that are genuinely nothing to act on. Everything else must be
      # handled.
      exclude-functions:
        # Deferred close on a read-only handle: nothing written can be lost.
        - (io.Closer).Close
        # Writing usage and report text to stdout/stderr.
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    rules:
      # Test helpers ignore returns on purpose; the test failing is the
      # error handling.
      - path: _test\.go
        linters: [errcheck]

formatters:
  # Reported as issues by `golangci-lint run`; applied by `golangci-lint fmt`.
  enable:
    - gofmt

issues:
  # Report everything at once rather than the first few of each kind.
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: go mod tidy -diff
      - run: go build ./...
      - run: go test -race -coverprofile=coverage.out ./...

  integration:
    # Backs up an in-memory cinc-server-ng, through the crawler and the CLI.
    # A separate Go module (./integration) so the cinc-server-ng dependency
    # never reaches the root module, which cinc-server-ng itself imports.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: integration/go.mod }
      - run: go mod tidy -diff
        working-directory: integration
      - run: go test -race ./...
        working-directory: integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        # The integration module needs the newer toolchain; it builds both.
        with: { go-version-file: integration/go.mod }
      - name: golangci-lint (vet, staticcheck, errcheck and gofmt)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned so a new linter release cannot turn a green branch red
          # without a commit.
          version: v2.14.0
      - name: golangci-lint (integration module, same checks)
        # A separate Go module, so the run above does not reach it.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: integration

  e2e-ng:
    # Backs up a real cinc-server-ng (the released container image, loaded with
    # its own dev/test-repo fixture), restores it into a fresh one, backs that
    # up and diffs the two backups. The version tracks integration/go.mod, so a
    # Dependabot bump of cinc-server-ng moves the image and fixture with it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - id: ng
        working-directory: integration
        run: |
          v=$(go list -m -f '{{.Version}}' github.com/cinc-project/cinc-server-ng)
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/cinc-project/cinc-server-ng:${v#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cinc-project/cinc-server-ng
          ref: ${{ steps.ng.outputs.tag }}
          path: ng
          sparse-checkout: dev/test-repo
      - run: scripts/e2e-ng.sh ng/dev/test-repo
        env:
          NG_IMAGE: ${{ steps.ng.outputs.image }}
